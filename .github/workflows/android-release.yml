name: Android release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish_enabled: ${{ steps.release.outputs.publish_enabled }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_status: ${{ steps.release.outputs.release_status }}
      release_track: ${{ steps.release.outputs.release_track }}
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - id: release
        env:
          PLAY_AUTOMATION_ENABLED: ${{ vars.PLAY_AUTOMATION_ENABLED }}
        run: |
          if [[ "$PLAY_AUTOMATION_ENABLED" == "true" ]]; then
            echo "publish_enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish_enabled=false" >>"$GITHUB_OUTPUT"
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release_track=production" >>"$GITHUB_OUTPUT"
            echo "release_name=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            echo "release_track=internal" >>"$GITHUB_OUTPUT"
            echo "release_name=main-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          fi

          echo "release_status=completed" >>"$GITHUB_OUTPUT"
          echo "version_code=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >>"$GITHUB_OUTPUT"

      - if: steps.release.outputs.publish_enabled != 'true'
        run: |
          echo "Play automation is currently disabled."
          echo "Set the PLAY_AUTOMATION_ENABLED repository variable to true after Play Console setup is complete."

  release:
    needs: preflight
    if: needs.preflight.outputs.publish_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate release configuration
        env:
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for var_name in \
            ANDROID_APPLICATION_ID \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required configuration: $var_name" >&2
              exit 1
            fi
          done

      - name: Validate production tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "$package_version" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Production tags must match package.json version." >&2
            echo "Expected $package_version or v$package_version, got $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prepare Google Play service account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"

      - name: Prepare Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shaykit-upload.jks"

      - name: Generate Android project
        env:
          CI: '1'
          APP_VARIANT: production
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
        run: npx expo prebuild --platform android

      - name: Build release bundle
        env:
          ORG_GRADLE_PROJECT_SHAYKIT_UPLOAD_STORE_FILE: ${{ runner.temp }}/shaykit-upload.jks
          ORG_GRADLE_PROJECT_SHAYKIT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SHAYKIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SHAYKIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew app:bundleRelease

      - name: Upload release bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ needs.preflight.outputs.release_track }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Google Play
        env:
          ANDROID_AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_APPLICATION_ID }}
          GOOGLE_PLAY_RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ needs.preflight.outputs.release_status }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH: ${{ runner.temp }}/google-play-service-account.json
          GOOGLE_PLAY_TRACK: ${{ needs.preflight.outputs.release_track }}
        run: npm run publish:play
